<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Wordle by Kabin</title>
  <meta name="theme-color" content="#1a1a2e" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Wordle" />
  <meta name="description" content="Guess the 5-letter word in 6 tries!" />
  <link rel="manifest" href="/static/manifest.json" />
  <link rel="apple-touch-icon" href="/static/icons/icon-192.png" />
  <link rel="icon" type="image/png" href="/static/icons/icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>
  <header>
    <div class="header-inner">
      <span class="header-icon">🟩</span>
      <h1>WORDLE</h1>
      <button id="btn-new-game" title="New Game">↺</button>
    </div>
    <div id="toast" class="toast hidden"></div>
  </header>
  <main>
    <section id="board" aria-label="Game board"></section>
    <section id="keyboard" aria-label="On-screen keyboard">
      <div class="kb-row" id="kb-row-1"></div>
      <div class="kb-row" id="kb-row-2"></div>
      <div class="kb-row" id="kb-row-3"></div>
    </section>
  </main>
  <div id="modal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-box">
      <div id="modal-emoji" class="modal-emoji"></div>
      <h2 id="modal-title"></h2>
      <p id="modal-subtitle"></p>
      <p id="modal-word" class="modal-word"></p>
      <button id="modal-btn">Play Again 🔄</button>
    </div>
  </div>
  <script src="/static/js/app.js"></script>
  <script src="/static/js/sw-register.js"></script>
</body>
</html>
